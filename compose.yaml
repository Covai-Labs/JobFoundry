name: jobfoundry

services:
  # JobFoundry All-in-One (Web Dashboard + Ingest API + Fit Scorer + Resume Tailor)
  jobfoundry:
    image: ghcr.io/rat-s/jobfoundry:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    # Compose automatically reads a local .env file for these optional overrides.
    # Defaults match the all-in-one image, so a fresh clone starts without one.
    environment:
      PORT: ${PORT-8080}
      API_KEYS: ${API_KEYS-}
      REGISTRATION_MODE: ${REGISTRATION_MODE-open}
      TRUST_PROXY: ${TRUST_PROXY-}
      DB_PATH: ${DB_PATH-/data/jobfoundry.db}
      ARTIFACTS_DIR: ${ARTIFACTS_DIR-/data/artifacts}
      DATA_DIR: ${DATA_DIR-/data}
      MASTER_RESUME_PATH: ${MASTER_RESUME_PATH-/data/master-resume.json}
      SCORER_MODEL: ${SCORER_MODEL-openrouter/google/gemini-2.0-flash-exp:free}
      SCORER_PROVIDER: ${SCORER_PROVIDER-openrouter}
      SCORER_THRESHOLD: ${SCORER_THRESHOLD-75}
      SCORER_API_KEY: ${SCORER_API_KEY-}
      SCORER_API_BASE: ${SCORER_API_BASE-}
      TAILOR_MODEL: ${TAILOR_MODEL-openrouter/google/gemini-2.0-flash-exp:free}
      TAILOR_PROVIDER: ${TAILOR_PROVIDER-openrouter}
      TAILOR_TIMEOUT_SECONDS: ${TAILOR_TIMEOUT_SECONDS-900}
      TAILOR_TIMEOUT_MS: ${TAILOR_TIMEOUT_MS-1800000}
      DATABASE_URL: ${DATABASE_URL-}
      DEFAULT_MODEL: ${DEFAULT_MODEL-}
      STRATEGY_AND_BASICS_MODEL: ${STRATEGY_AND_BASICS_MODEL-}
      STRATEGY_MODEL: ${STRATEGY_MODEL-}
      WORK_MODEL: ${WORK_MODEL-}
      QUALIFICATIONS_MODEL: ${QUALIFICATIONS_MODEL-}
      EDUCATION_MODEL: ${EDUCATION_MODEL-}
      SKILLS_MODEL: ${SKILLS_MODEL-}
      PROJECTS_MODEL: ${PROJECTS_MODEL-}
      CERTIFICATES_MODEL: ${CERTIFICATES_MODEL-}
      OPTIONAL_SECTIONS_MODEL: ${OPTIONAL_SECTIONS_MODEL-}
      BASICS_MODEL: ${BASICS_MODEL-}
      TAILOR_SECTIONS: ${TAILOR_SECTIONS-basics,work,skills,projects,education,certificates}
      TAILOR_STYLE: ${TAILOR_STYLE-}
      TAILORING_STYLE: ${TAILORING_STYLE-}
      DEFAULT_THEME: ${DEFAULT_THEME-jsonresume-theme-folio}
      ALLOWED_THEMES: ${ALLOWED_THEMES-jsonresume-theme-folio jsonresume-theme-stackoverflow}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS-2}
      CALLBACK_TIMEOUT_SECONDS: ${CALLBACK_TIMEOUT_SECONDS-5}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT-600}
      LLM_RATE_LIMIT_REQUESTS: ${LLM_RATE_LIMIT_REQUESTS-20}
      LLM_RATE_LIMIT_PERIOD: ${LLM_RATE_LIMIT_PERIOD-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES-25}
      LLM_RETRY_MIN_WAIT_SECONDS: ${LLM_RETRY_MIN_WAIT_SECONDS-5}
      LLM_RETRY_MAX_WAIT_SECONDS: ${LLM_RETRY_MAX_WAIT_SECONDS-120}
      LLM_RETRY_MULTIPLIER: ${LLM_RETRY_MULTIPLIER-3}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE-}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      OPENAI_API_BASE: ${OPENAI_API_BASE-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY-}
      DEFAULT_LLM_API_BASE: ${DEFAULT_LLM_API_BASE-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER-openrouter}
      COPILOT_MODEL: ${COPILOT_MODEL-}
      COPILOT_PROVIDER: ${COPILOT_PROVIDER-}
      COPILOT_API_KEY: ${COPILOT_API_KEY-}
      COPILOT_API_BASE: ${COPILOT_API_BASE-}
      GEMINI_API_KEY: ${GEMINI_API_KEY-}
      ALLOWED_LLM_BASES: ${ALLOWED_LLM_BASES-}
      HOST: ${HOST-0.0.0.0}
      WORKER_ENABLED: ${WORKER_ENABLED-true}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS-10}
      USE_STUB_LLM: ${USE_STUB_LLM-}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY-1}
      LLM_CACHE: ${LLM_CACHE-false}
      LOG_LEVEL: ${LOG_LEVEL-info}
      ENABLE_TRACING: ${ENABLE_TRACING-false}
      OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME-jobfoundry}
      OPIK_API_KEY: ${OPIK_API_KEY-}
      OPIK_WORKSPACE: ${OPIK_WORKSPACE-}
      OPIK_URL_OVERRIDE: ${OPIK_URL_OVERRIDE-}
      EVAL_MODEL: ${EVAL_MODEL-}
    volumes:
      - jobfoundry-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  jobfoundry-data:
