name: Deploy GitHub Pages

# The docs site (site/) is built fresh on every deploy and uploaded as an
# artifact. Build output is never committed — see .gitignore (/docs/).
#
# The architecture graph (graphify-out/) is handled the same way: `graphify
# update` rebuilds it from source on the runner (no LLM, no keys) and only the
# rendered HTML is published, at /graph.html. Nothing from graphify-out/ is
# ever committed, so it cannot churn diffs or bot scans.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'VERSION'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs site
        # Custom domain (CNAME: jobfoundry.covai.org) serves at root, so the
        # default base '/' applies. If these Pages ever move back to the
        # project subpath, set ASTRO_BASE: '/JobFoundry/' here
        # (astro.config.mjs reads it).
        run: npm run site:build

      # Publish the interactive architecture graph without tracking it. The
      # version is pinned so the published snapshot is reproducible; a failure
      # here must not block the docs deploy.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build architecture graph
        continue-on-error: true
        run: |
          uv tool install --no-build 'graphifyy==0.9.86'
          graphify update .
          cp graphify-out/graph.html site/dist/graph.html
          cp graphify-out/GRAPH_REPORT.md site/dist/graph-report.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'site/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
