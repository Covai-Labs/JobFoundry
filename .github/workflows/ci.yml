name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # No paths-ignore for pull_request: the `main` ruleset requires the
  # "Node lint + test", "Python scorer tests" and "Resume tailor tests"
  # checks. Any paths-ignore here makes those checks unpassable for
  # documentation-only PRs, which blocks them from ever merging
  # (#155 hit exactly this). Docs PRs run the full suite instead.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 'lts/*'
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --dev
        working-directory: server/scorer
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  extension:
    name: Extension test, build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare extension
        run: npm --workspace=extension run postinstall
      - name: Run extension tests
        run: npm run extension:test
      - name: Build & lint Firefox extension
        run: npm run extension:lint

  python:
    name: Python scorer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/scorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned because the step below recompiles packaging/python and compares
      # the result byte-for-byte: a different resolver would fail the check on
      # an unchanged tree.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
      - run: uv sync --dev
        env:
          UV_EXTRA_BUILD_DEPENDENCIES: hatchling
      - run: uv run pytest
      - name: Validate packaging requirements resolve cleanly
        run: |
          uv venv --python 3.14 /tmp/packaging-venv
          uv pip install --dry-run --python /tmp/packaging-venv/bin/python -r ../../packaging/python/scorer-requirements.txt
          uv pip install --dry-run --python /tmp/packaging-venv/bin/python -r ../../packaging/python/tailor-requirements.txt
      # packaging/python/*.txt are compiled lockfiles, and nothing used to
      # regenerate them (#185). This fails instead of letting them rot: it
      # checks that existing pins satisfy pyproject.toml manifests without drift.
      - name: Check packaging requirements are up to date
        working-directory: ${{ github.workspace }}
        run: scripts/regen-packaging-requirements.sh --check

  tailor:
    name: Resume tailor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/tailor
    env:
      DEFAULT_MODEL: test-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --dev
        env:
          UV_EXTRA_BUILD_DEPENDENCIES: hatchling
      - run: uv run pytest tests/test_api.py tests/test_render_api.py tests/test_merge.py tests/test_cli.py tests/test_config.py tests/test_db.py

  docker:
    name: Container image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
