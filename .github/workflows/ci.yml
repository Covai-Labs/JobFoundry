name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --dev
        working-directory: server/scorer
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  python:
    name: Python scorer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/scorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --dev
        env:
          UV_EXTRA_BUILD_DEPENDENCIES: hatchling
      - run: uv run pytest

  tailor:
    name: Resume tailor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/tailor
    env:
      DEFAULT_MODEL: test-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --dev
        env:
          UV_EXTRA_BUILD_DEPENDENCIES: hatchling
      - run: uv run pytest tests/test_api.py tests/test_merge.py tests/test_cli.py tests/test_config.py tests/test_db.py

  docker:
    name: Container image build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
