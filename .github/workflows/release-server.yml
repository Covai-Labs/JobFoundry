name: Release Server

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    container: almalinux:10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build prerequisites
        run: |
          dnf -q -y install file unzip xz libatomic nspr nss nss-util cairo pango atk at-spi2-atk \
            cups-libs libdrm mesa-libgbm alsa-lib libX11 libXcomposite libXdamage \
            libXext libXfixes libXrandr libxshmfence libxkbcommon

      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Upload AppImage (CI)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobfoundry-appimage
          path: build/appimage/output/*.AppImage

      - name: Attach AppImage to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/appimage/output/*.AppImage

  build-macos-tarballs:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The build runs npm/uv installs with lifecycle scripts against
          # third-party registries; don't leave the write-scoped token in
          # .git/config where a compromised dependency could grab it.
          # (Release upload uses the token via env, unaffected.)
          persist-credentials: false

      - name: Build macOS tarball (darwin-arm64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packaging/macos/build-macos.sh

      - name: Smoke test macOS bundle on runner
        env:
          JOBFOUNDRY_NO_BROWSER: '1'
          OPENROUTER_API_BASE: 'https://openrouter.ai/api/v1'
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/jf-smoke"
          mkdir -p "$SMOKE_DIR"
          tar -xzf build/macos/output/jobfoundry-*-darwin-arm64.tar.gz -C "$SMOKE_DIR"
          test -x "$SMOKE_DIR/bin/jobfoundry"
          # Safe smoke test: never starts daemons, always exits 0.
          "$SMOKE_DIR/bin/jobfoundry" status
          # Full lifecycle on a real Mac: start all services, verify health,
          # then stop. `start` blocks until /health is 200 (up to 180s).
          "$SMOKE_DIR/bin/jobfoundry" start
          trap '"$SMOKE_DIR/bin/jobfoundry" stop' EXIT
          "$SMOKE_DIR/bin/jobfoundry" status
          curl -fsS --max-time 30 http://localhost:8080/health
          "$SMOKE_DIR/bin/jobfoundry" stop
          trap - EXIT

      - name: Dump smoke test logs on failure
        if: failure()
        run: |
          for log in "$HOME/.local/share/jobfoundry/logs"/*.log; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              cat "$log"
            fi
          done

      - name: Upload macOS tarball (CI)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobfoundry-macos-darwin-arm64
          path: |
            build/macos/output/*.tar.gz
            build/macos/output/*.sha256

      - name: Attach macOS tarball to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/macos/output/*.tar.gz
            build/macos/output/*.sha256

  build-windows-payload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Windows MSIX payload
        run: bash packaging/windows/build-windows.sh

      - name: Upload Windows payload (CI)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobfoundry-windows-payload
          path: build/windows/payload/

  package-windows-msix:
    runs-on: windows-latest
    needs: build-windows-payload
    permissions:
      contents: write
    env:
      MSIX_SIGNING_PFX: ${{ secrets.MSIX_SIGNING_PFX }}
      MSIX_SIGNING_PFX_PASSWORD: ${{ secrets.MSIX_SIGNING_PFX_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Windows payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jobfoundry-windows-payload
          path: payload

      - name: Pack and sign MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kits = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Where-Object { $_.Name -as [version] } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $kits) { throw 'Windows SDK not found' }
          $makeappx = Join-Path $kits.FullName 'x64\makeappx.exe'
          $signtool = Join-Path $kits.FullName 'x64\signtool.exe'
          if (-not (Test-Path $makeappx)) { throw "makeappx not found: $makeappx" }
          if (-not (Test-Path $signtool)) { throw "signtool not found: $signtool" }

          [xml]$manifest = Get-Content .\payload\AppxManifest.xml
          $ver = $manifest.Package.Identity.Version
          $ver = $ver -replace '\.0$', ''

          New-Item -ItemType Directory -Force -Path build | Out-Null
          $pfx = Join-Path (Get-Location) 'build\jobfoundry.pfx'
          $cer = Join-Path (Get-Location) 'build\JobFoundry.cer'
          $pfxPassword = 'jobfoundry-build'

          if ($env:MSIX_SIGNING_PFX -and $env:MSIX_SIGNING_PFX_PASSWORD) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_SIGNING_PFX))
            $sec = ConvertTo-SecureString $env:MSIX_SIGNING_PFX_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
            $pfxPassword = $env:MSIX_SIGNING_PFX_PASSWORD
            Write-Host "[jobfoundry] signed with persistent certificate: $($cert.Subject)"
          } else {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject 'CN=JobFoundry' -CertStoreLocation Cert:\CurrentUser\My `
              -KeyExportPolicy Exportable -KeyUsage DigitalSignature `
              -KeyAlgorithm RSA -KeyLength 2048 -NotAfter (Get-Date).AddYears(3)
            $sec = ConvertTo-SecureString $pfxPassword -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $sec | Out-Null
            Write-Host "[jobfoundry] signed with new per-release self-signed certificate"
          }
          Export-Certificate -Cert $cert -FilePath $cer -Force | Out-Null

          $msix = Join-Path (Get-Location) "build\JobFoundry-$ver-x64.msix"
          & $makeappx pack /d (Resolve-Path .\payload).Path /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed (exit $LASTEXITCODE)" }
          & $signtool sign /fd SHA256 /f $pfx /p $pfxPassword `
            /tr http://timestamp.digicert.com /td SHA256 $msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed (exit $LASTEXITCODE)" }
          Get-ChildItem build | Format-Table Name, Length -AutoSize

      - name: Upload MSIX artifacts (CI)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jobfoundry-windows-msix
          path: |
            build/*.msix
            build/*.cer

      - name: Attach MSIX to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/*.msix
            build/*.cer

  bump-homebrew-formula:
    name: Bump Homebrew formula
    runs-on: ubuntu-latest
    needs: build-macos-tarballs
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download macOS tarball artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: jobfoundry-macos-darwin-arm64
          path: macos-artifacts

      - name: Update Homebrew formula
        if: env.GH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          SHA=$(cat macos-artifacts/*.sha256 | awk '{print $1}')
          TAG=${{ github.ref_name }}
          VER=${TAG#v}
          echo "Updating Homebrew formula to $VER ($SHA)..."
          FORMULA_SHA=$(gh api repos/Covai-Labs/homebrew-tap/contents/Formula/jobfoundry.rb --jq '.sha')
          sed -i -E \
            -e "s/version \".*\"/version \"$VER\"/" \
            -e "s|download/v.*/jobfoundry-.*-darwin-arm64\.tar\.gz|download/$TAG/jobfoundry-$VER-darwin-arm64.tar.gz|" \
            -e "s/sha256 \".*\"/sha256 \"$SHA\"/" \
            packaging/homebrew/jobfoundry.rb
          CONTENT=$(base64 -w 0 packaging/homebrew/jobfoundry.rb)
          gh api --method PUT repos/Covai-Labs/homebrew-tap/contents/Formula/jobfoundry.rb \
            -f message="release: bump jobfoundry to $TAG" \
            -f content="$CONTENT" \
            -f sha="$FORMULA_SHA"
