# SonarCloud analysis scope.
#
# `graphify-out/` holds generated architecture-graph snapshots (`graphify
# update`). They are committed for reference only — never hand-edited, not
# shipped — so they must never influence the quality gate. SonarCloud does not
# currently index them (they contain no analysed language), but the exclusion
# keeps that true if the snapshots ever gain HTML/JS/CSS content.
sonar.projectKey=Covai-Labs_JobFoundry
sonar.organization=covai
sonar.exclusions=graphify-out/**
