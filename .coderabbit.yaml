# CodeRabbit configuration. See
# https://docs.coderabbit.ai/reference/configuration
#
# `graphify-out/` holds generated architecture-graph snapshots (megabytes of
# HTML/JSON). They are committed for reference, but reviewing them costs
# tokens and produces no useful findings.
reviews:
  path_filters:
    - '!graphify-out/**'
    - '!extension/src/background/providers/**'
    - '!extension/src/background/lib/**'
    - '!extension/src/background/tests/fixtures/**'
    - '!extension/src/background/user-agent.mjs'
    - '!extension/src/background/ats-vendor.mjs'
    - '!extension/src/background/liveness-api.mjs'
    - '!extension/src/background/himalayas-posting.mjs'
    - '!extension/src/background/robots-check.mjs'
    - '!extension/scripts/ports/**'
    - '!server/ingest/src/vendored/**'
    - '!templates/**'
