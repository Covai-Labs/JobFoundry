# SonarQube Cloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

sonar.projectKey=Covai-Labs_JobFoundry
sonar.organization=covai
sonar.projectName=JobFoundry

# Source and Test roots
sonar.sources=server,extension/src,site/src,scripts
sonar.tests=test,extension/test,extension/src/background/tests,server/ingest/test,server/scorer/tests,server/tailor/tests,server/web

# Test file patterns
sonar.test.inclusions=**/__tests__/**,**/*.test.*,**/*.spec.*,**/tests/**,**/test/**,**/test_*.py
sonar.test.exclusions=**/fixtures/**

# Excluded from analysis:
# - Test files (excluded from main sources to avoid double-counting)
# - Scraped test fixtures & mock HTML
# - Machine-generated artifacts (graphify-out)
# - Installer & packaging scripts (packaging)
# - CI workflows (.github)
# - Internal sync/release scripts (extension/scripts)
# - Upstream vendored provider layer (kept byte-identical per AGENTS.md)
# - Build artifacts, databases, and scratch folders
sonar.exclusions=\
  **/node_modules/**,\
  **/__tests__/**,\
  **/*.test.*,\
  **/*.spec.*,\
  **/tests/**,\
  **/test/**,\
  **/fixtures/**,\
  graphify-out/**,\
  packaging/**,\
  .github/**,\
  extension/scripts/**,\
  extension/src/background/providers/**,\
  extension/src/background/lib/**,\
  dist/**,\
  dist-extension/**,\
  site/dist/**,\
  Scratch/**,\
  data/**,\
  **/*.db*
